name: Release

on:
  push:
    tags:
      - "v*"   # e.g. v1.0.0
      - "[0-9]*" # e.g. 1.0.0, 0.0.1

permissions:
  contents: write   # needed to create GitHub Releases and upload assets

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git describe can find the tag

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build & package
        shell: pwsh
        run: bin/release.ps1 -Version "${{ github.ref_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          files: dist/sftpplug-${{ github.ref_name }}.zip
