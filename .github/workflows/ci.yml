name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]   # release workflow handles tags
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Release|Win32
        run: msbuild sftpplug.sln /p:Configuration=Release /p:Platform=Win32 /m /nologo /v:minimal

      - name: Build Release|x64
        run: msbuild sftpplug.sln /p:Configuration=Release /p:Platform=x64 /m /nologo /v:minimal

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sftpplug-binaries
          path: |
            wfx/sftpplug.wfx
            wfx/sftpplug.wfx64
          if-no-files-found: error

  # The shared agent rules in .agents/ and .claude/ are vendored from the
  # agent-standards repo and are changed there, not here. An edited copy looks
  # exactly like an untouched one, and the diff of such an edit is just the
  # edit, so nothing in a review flags it. The checker ships with the rules and
  # is stdlib-only, so this needs no setup-python and no network.
  #
  # ubuntu, not windows-latest like `build`: it reads files and hashes them, and
  # the hashes are line-ending independent by construction.
  agents-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vendored agent rules are unedited
        run: python3 .agents/check.py
